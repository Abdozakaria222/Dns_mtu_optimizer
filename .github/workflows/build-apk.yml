name: Build APK

on:
  workflow_dispatch:        # Actions tab -> Build APK -> Run workflow
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf automake libtool libtool-bin \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Cache Buildozer downloads (SDK / NDK)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Install Buildozer
        run: pip install --upgrade pip "buildozer==1.5.0" "Cython==0.29.37" virtualenv setuptools

      - name: Build debug APK
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: Show the error on the run summary page
        if: failure()
        shell: bash
        run: |
          {
            echo "## Build failed"
            echo "### Error-like lines"
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' build.log | grep -n -i -E "error|failed|not found|exception|no such" | tail -n 40 || true
            echo '```'
            echo "### Last 80 lines"
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' build.log | tail -n 80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetOptimizer-apk
          path: bin/*.apk
          if-no-files-found: error
